
name: Update Find a Tender RSS

on:
  workflow_dispatch:
  schedule:
    - cron:  '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Find a Tender RSS
        run: python generate_find_tender.py

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add find_tender.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update Find a Tender RSS feed"
            git push
          fi
  
