
name: Update Scotland Contracts RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: scotland-rss
  cancel-in-progress: false

jobs:
  update-scotland:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SSL certificates
        run: python -m pip install --upgrade certifi truststore
      - name: Download Scottish API intermediate certificate
        run: |
          curl --fail --location --retry 3 \
            --output sectigo-intermediate.crt \
            "http://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt"
          openssl x509 -inform DER -in sectigo-intermediate.crt \
            -noout -subject -issuer -fingerprint -sha256
      - name: Diagnose Scottish API SSL
        run: |
          python - <<'PY'
          import ssl
          import urllib.request
          import certifi
          import truststore

          url = "https://api.publiccontractsscotland.gov.uk/v1/Notices"

          contexts = {
              "System certificates": ssl.create_default_context(),
              "Certifi certificates": ssl.create_default_context(cafile=certifi.where()),
              "Truststore certificates": truststore.SSLContext(ssl.PROTOCOL_TLS_CLIENT),
          }

          for name, context in contexts.items():
              try:
                  with urllib.request.urlopen(url, context=context, timeout=15) as response:
                      print(f"{name}: HTTP {response.status}")
              except urllib.error.HTTPError as error:
                  print(f"{name}: HTTP {error.code} (TLS connection succeeded)")
              except Exception as error:
                  print(f"{name}: {type(error).__name__}: {error}")
          PY
      - name: Generate Scottish RSS feed
        run: python generate_scotland.py
      - name: Commit updated RSS feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotland.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update Scotland contracts RSS"
            git push
          else
            echo "No feed changes"
          fi
